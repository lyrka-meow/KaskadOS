# KaskadShell — MangoWM configuration (managed by `kaskad-shell setup`)
# Keybinds, colors, layout, outputs, cursor and window rules are pulled from the
# ./kaskad-shell fragments below. Add your own binds/rules here; they sit alongside Kaskad's.

env=XDG_CURRENT_DESKTOP,mango
env=XDG_SESSION_TYPE,wayland

# exec-once runs only at startup. Do NOT use exec= for the shell: mango re-runs
# every exec= on each config reload, and Kaskad reloads the config, which would
# spawn a new shell on every reload.
exec-once=kaskad-shell run

source=./kaskad-shell/colors.conf
source=./kaskad-shell/layout.conf
source=./kaskad-shell/cursor.conf
source=./kaskad-shell/outputs.conf
source=./kaskad-shell/windowrules.conf
source=./kaskad-shell/binds.conf
