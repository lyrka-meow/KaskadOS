[preferred]
# Kaskad is the Qt backend for Kaskad DE.
default=kaskad
# KaskadOS currently has no managed-device policy provider. Explicitly expose
# no Lockdown backend instead of silently importing GNOME policy settings.
org.freedesktop.impl.portal.Lockdown=none
# Do not activate KDE Wallet in the KaskadOS session. Secret storage will be
# enabled only after KaskadOS has its own backend and migration policy.
org.freedesktop.impl.portal.Secret=none
