# Связь пакетов ISO с конкретными потребителями.
# Формат: потребитель: точное-имя или glob-шаблон
# Один пакет можно указать у нескольких потребителей. В интерфейсе он всё равно
# будет одной строкой, но попадёт в общий раздел соответствующего уровня.
# Всё, что не перечислено здесь, относится к базовой Live-системе.

installer.calamares: arch-install-scripts archinstall karchive kconfig kcoreaddons ki18n kpmcore parted qt6-base qt6-declarative qt6-svg rsync solid yaml-cpp
installer.compositor: kconfig kcoreaddons kdecoration kglobalaccel ki18n kidletime knotifications kpackage kwayland kwindowsystem libqaccessibilityclient-qt6 qt6-base qt6-declarative qt6-svg qt6-wayland wayland xorg-xwayland

desktop.compositor: kconfig kcoreaddons kcrash kdecoration kglobalaccel ki18n kidletime knighttime knotifications kpackage kstatusnotifieritem kwayland kwindowsystem libqaccessibilityclient-qt6 mesa plasma-activities qt6-base qt6-declarative qt6-svg qt6-wayland solid vulkan-* wayland xkeyboard-config xorg-xwayland
desktop.portal: karchive kbookmarks kcodecs kconfig kcoreaddons kcrash kglobalaccel ki18n kiconthemes kio kitemviews kjobwidgets kservice kwayland kwidgetsaddons kwindowsystem kxmlgui qt6-base qt6-declarative qt6-svg qt6-wayland solid wayland xkeyboard-config
desktop.shell: breeze-cursors breeze-icons cava inter-font kirigami libplasma noto-fonts* plasma-activities qt6-* quickshell ttf-dejavu ttf-fira-code ttf-material-symbols-variable ttf-nerd-fonts-symbols wayland xkeyboard-config
desktop.integration: dgop flatpak kaskados-desktop kaskados-globalacceld sddm umu-launcher xdg-utils

