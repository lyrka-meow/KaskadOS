network: bind bluez bluez-utils dhcpcd dnsmasq ethtool iw iwd modemmanager ndisc6 networkmanager nfs-utils nmap open-iscsi openconnect openssh openvpn ppp pptpclient systemd-resolvconf tcpdump usb_modeswitch vpnc wireless-regdb wireless_tools wpa_supplicant wvdial xl2tpd

