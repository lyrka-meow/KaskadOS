# KaskadOS installer design preview.
# This file is a developer tool and is never copied into the live image.
---
modules-search: [ local ]

instances:
- id: preview
  module: shellprocess
  config: shellprocess@preview.conf

sequence:
- show:
  - users
  - locale
  - keyboard
  - partition
- exec:
  - shellprocess@preview
- show:
  - finished

branding: default
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: false
quit-at-end: false
